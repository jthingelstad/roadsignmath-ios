name: test

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The equation checker's vectors must be the server's, byte for byte.
      - name: Equation vectors match the server's
        run: scripts/check-vectors.sh
      - name: RoadSignMathKit tests
        run: swift test --package-path RoadSignMathKit
      # TestFlight builds are optimized, and the optimizer has broken code
      # that Debug ran fine (a task group, in a sibling app's crash on launch).
      - name: RoadSignMathKit tests, optimized
        run: swift test -c release -Xswiftc -enable-testing --package-path RoadSignMathKit
